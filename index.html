<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PS5 Exploit Hub - Mantix47/test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    user-select: none;
    -webkit-user-select: none;
    background-color: #0c0c0f;
    color: #ffffff;
    font-family: Arial, -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}
#cat {
    width: 240px;
    max-width: 66vw;
    border-radius: 10px;
    margin-bottom: 24px;
    box-shadow: 0 0 0 2px #2a2a2e, 0 0 20px 4px #2a2a2e;
    transition: transform 0.2s ease;
}
#cat:hover {
    transform: scale(1.02);
}
.btn {
    padding: 1.1rem 2.4rem;
    text-align: center;
    cursor: pointer;
    min-width: 14rem;
    border-radius: 1.25rem;
    background-color: #2563eb;
    border: none;
    color: #ffffff;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.5px;
    transition: background-color 0.25s ease, transform 0.1s ease;
    text-decoration: none;
    display: inline-block;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
}
.btn:hover:not(.disabled) {
    background-color: #1d4ed8;
}
.btn:active:not(.disabled) {
    transform: scale(0.98);
}
.btn.disabled {
    opacity: 0.35;
    pointer-events: none;
    background-color: #202125;
    box-shadow: none;
    cursor: not-allowed;
}
#msg {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-top: 18px;
    min-height: 1.2em;
    text-align: center;
    font-weight: 500;
}
.fw-badge {
    margin-top: 10px;
    font-size: 0.8rem;
    color: #64748b;
    background: #141419;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #1e1e26;
}
</style>
</head>
<body>

<img id="cat" src="cat.jpg" alt="PS5 Exploit Status">
<a tabindex="0" class="btn disabled" id="run">RUN EXPLOIT</a>
<div id="msg">Detecting PlayStation 5 environment & loading offsets...</div>
<div id="fwBadge" class="fw-badge">Initializing Mantix47/test...</div>

<script>
"use strict";

// Relative file paths mapped to your repository root
const EXPLOIT_URL = "notify.html";
const OFFSETS_URLS = ["offsets/offsets.json", "offsets.json"];

const run = document.getElementById("run");
const msg = document.getElementById("msg");
const fwBadge = document.getElementById("fwBadge");

// Detect PS5 User-Agent
const m = /PlayStation 5\/(\d+)\.(\d+)/.exec(navigator.userAgent);
let fw = m ? `${m[1].padStart(2, "0")}.${m[2].padStart(2, "0")}` : null;

// Fallback to 11.60 profile if tested on PC / standard browser
if (!fw) {
    fw = "11.60";
    fwBadge.textContent = "Profile: PS5 FW 11.60 (Mantix47/test)";
} else {
    fwBadge.textContent = `Target: PlayStation 5 (FW ${fw})`;
}

let entry = null;

function fwNum(s) {
    const p = s.split(".");
    return parseInt(p[0], 10) * 100 + parseInt(p[1], 10);
}

// Find closest major firmware if exact minor revision is missing
function nearest(data, target) {
    const want = fwNum(target);
    const maj = target.split(".")[0];
    let best = null, bestd = 1e9;
    for (const k in data) {
        if (k.split(".")[0] !== maj) continue;
        const d = Math.abs(fwNum(k) - want);
        if (d < bestd) { bestd = d; best = k; }
    }
    return best;
}

// Load offsets from Mantix47/test repository files
async function initOffsets() {
    let data = null;
    for (const url of OFFSETS_URLS) {
        try {
            const r = await fetch(url, { cache: "no-store" });
            if (r.ok) {
                data = await r.json();
                break;
            }
        } catch (_) {}
    }

    if (!data) {
        msg.textContent = "Error: offsets.json not found in Mantix47/test repository.";
        return;
    }

    entry = data[fw];
    if (entry) {
        msg.textContent = `Offsets loaded for FW ${fw}. Click RUN EXPLOIT.`;
        run.classList.remove("disabled");
        return;
    }

    const near = nearest(data, fw);
    if (near) {
        entry = data[near];
        msg.textContent = `${fw}: using compatible offsets from ${near}`;
        run.classList.remove("disabled");
    } else {
        msg.textContent = `Firmware ${fw} not supported in offsets database.`;
    }
}

// Format exact query parameters and launch notify.html
run.addEventListener("click", function () {
    if (!entry) return;
    const q = new URLSearchParams();
    q.set("go", "1");
    q.set("fw", fw);
    q.set("hc", Array.isArray(entry.hc) ? entry.hc.join(",") : entry.hc);
    q.set("gd", entry.gd);
    q.set("notify", entry.nt);
    q.set("gps", entry.gps);
    q.set("gpe", entry.gpe);
    q.set("cls", entry.cls);
    q.set("cle", entry.cle);
    q.set("ers", entry.ers);
    q.set("ere", entry.ere);
    q.set("rd", "100");
    q.set("lines", "20");

    location.href = `${EXPLOIT_URL}?${q.toString()}`;
});

initOffsets();
</script>
</body>
</html>
